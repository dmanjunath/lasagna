<svg xmlns="http://www.w3.org/2000/svg" color="#2A2420" viewBox="0 0 140 124" role="img" aria-label="Noodle, a lasagna slice, asleep">
  <!-- currentColor is the outline token: the silhouette and arms, the strokes that meet the page. It defaults to ink (the color attribute above). The app sets it from the theme so the outline stays visible on a dark canvas. Every other color is the artwork itself. -->
