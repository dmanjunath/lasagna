  <path d="M16 44 L106 44 L124 30 L34 30 Z" fill="#FFC93C"/>
  <ellipse cx="52" cy="37" rx="6" ry="2.4" fill="#E39A22"/>
  <ellipse cx="82" cy="34" rx="5" ry="2" fill="#E39A22"/>
  <ellipse cx="98" cy="40" rx="4" ry="1.8" fill="#E39A22"/>
  <path d="M64 37 C66 28 76 24 84 26 C82 33 74 38 64 37 Z" fill="#1DB06B" stroke="#2A2420" stroke-width="2" stroke-linejoin="round"/>
  <!-- front face layers -->
  <rect x="16" y="44" width="90" height="64" fill="#F7D774"/>
  <path d="M16 44 H106 V52 C100 52 100 58 94 58 C88 58 88 52 82 52 C78 52 78 61 72 61 C66 61 66 52 60 52 C54 52 54 57 48 57 C42 57 42 52 36 52 C30 52 30 59 24 59 C20 59 18 55 16 55 Z" fill="#FFC93C"/>
  <path d="M16 58 C30 56 50 60 70 57 C88 55 98 59 106 58 V66 H16 Z" fill="#E8432B"/>
  <rect x="16" y="66" width="90" height="18" fill="#FFF6E0"/>
