  <path d="M16 44 L34 30 L124 30 L124 94 L106 108 L16 108 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M16 44 L106 44 L124 30 M106 44 L106 108" fill="none" stroke="#2A2420" stroke-width="3" stroke-linejoin="round"/>
