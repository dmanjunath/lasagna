name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lasagna/core build

      - run: pnpm typecheck

      - run: pnpm lint --max-warnings 0

      - run: pnpm --filter @lasagna/core test

      # Behind UTC, where a calendar day stored as midnight UTC used to print as
      # the day before. The runner is UTC, which hides exactly that class of bug.
      - run: pnpm --filter @lasagna/web test
        env:
          TZ: America/Los_Angeles
